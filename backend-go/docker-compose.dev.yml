version: '3.9'

# Ce fichier permet de lancer le backend Go en dev avec les services existants
# Usage: docker-compose -f docker-compose.dev.yml up

services:
  backend-go:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      # Database (shared with Python backend)
      DATABASE_URL: postgresql://cinema:cinema@postgres:5432/cinema?sslmode=disable

      # Vault (shared with Python backend)
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: backend-token
      VAULT_TRANSIT_KEY: cinema-dcs
      VAULT_KV_PEPPER_PATH: secret/dcs

      # JWT (same config as Python)
      JWT_SECRET: dev-secret-change-me
      JWT_ISSUER: cinema-dcs-poc
      JWT_AUDIENCE: cinema-ui
      JWT_TTL_MINUTES: 240

      # DCS Config
      ENV: dev
      DCS_MODE: on
      CACHE_LEVEL: 1

      # Cache TTLs
      CACHE_TTL_CLASSIF_SEC: 300
      CACHE_TTL_PDP_SEC: 60
      CACHE_TTL_KMS_SEC: 10
      CACHE_TTL_PEPPER_SEC: 300
      CACHE_MAX_ENTRIES: 500

      # Server addresses
      HTTP_ADDR: :8001
      GRPC_ADDR: :50051
      LOG_LEVEL: DEBUG

    ports:
      - "8001:8001"  # HTTP
      - "50051:50051"  # gRPC
    depends_on:
      - postgres
      - vault-init
    networks:
      - poc-dcs_internal
    restart: unless-stopped

# Use existing network from main docker-compose.yml
networks:
  poc-dcs_internal:
    external: true
    name: poc-dcs_internal
