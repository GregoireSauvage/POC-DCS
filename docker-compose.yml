services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cinema
      POSTGRES_USER: cinema
      POSTGRES_PASSWORD: cinema
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinema -d cinema"]
      interval: 5s
      timeout: 3s
      retries: 20

  vault:
    image: hashicorp/vault:1.16
    cap_add: [IPC_LOCK]
    command: ["vault", "server", "-config=/vault/config/vault.hcl"]
    ports: ["8200:8200"]
    volumes:
      - vaultdata:/vault/file
      - ./infra/vault/config/vault.hcl:/vault/config/vault.hcl:ro
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "VAULT_ADDR=http://127.0.0.1:8200 vault operator init -status >/dev/null 2>&1; rc=$$?; [ $$rc -eq 0 ] || [ $$rc -eq 2 ]"]
      interval: 3s
      timeout: 2s
      retries: 30
      start_period: 5s

  vault-init:
    image: hashicorp/vault:1.16
    depends_on:
      vault:
        condition: service_started
    environment:
      VAULT_ADDR: http://vault:8200
      TRANSIT_KEY_NAME: cinema-dcs
      BACKEND_TOKEN_ID: backend-token
    volumes:
      - vaultdata:/vault/file
      - ./infra/vault/init:/init:ro
    entrypoint: ["sh", "/init/init.sh"]
    networks: [internal]
    restart: "on-failure"

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://cinema:cinema@postgres:5432/cinema
      JWT_SECRET: dev-secret-change-me
      JWT_ISSUER: cinema-dcs-poc
      JWT_AUDIENCE: cinema-ui
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: backend-token
      VAULT_TRANSIT_KEY: cinema-dcs
      VAULT_KV_PEPPER_PATH: secret/dcs
      ENV: dev
      DCS_MODE: on
      CACHE_LEVEL: 1
      CACHE_TTL_CLASSIF_SEC: 300
      CACHE_TTL_PDP_SEC: 60
      CACHE_TTL_KMS_SEC: 10
      CACHE_TTL_PEPPER_SEC: 300
      CACHE_MAX_ENTRIES: 500
    depends_on:
      postgres:
        condition: service_healthy
      vault-init:
        condition: service_started
    networks: [internal]
    expose:
      - "8000"

  backend-go:
    build:
      context: ./backend-go
      dockerfile: Dockerfile.dev
    environment:
      # Database (shared)
      DATABASE_URL: postgresql://cinema:cinema@postgres:5432/cinema?sslmode=disable

      # Vault (shared)
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: backend-token
      VAULT_TRANSIT_KEY: cinema-dcs
      VAULT_KV_PEPPER_PATH: secret/dcs

      # JWT
      JWT_SECRET: dev-secret-change-me
      JWT_ISSUER: cinema-dcs-poc
      JWT_AUDIENCE: cinema-ui
      JWT_TTL_MINUTES: 240

      # DCS Config
      ENV: dev
      DCS_MODE: on
      CACHE_LEVEL: 1

      # Cache TTLs
      CACHE_TTL_CLASSIF_SEC: 300
      CACHE_TTL_PDP_SEC: 60
      CACHE_TTL_KMS_SEC: 10
      CACHE_TTL_PEPPER_SEC: 300
      CACHE_MAX_ENTRIES: 500

      # Server addresses
      HTTP_ADDR: :8001
      GRPC_ADDR: :50051
      LOG_LEVEL: DEBUG
    depends_on:
      postgres:
        condition: service_healthy
      vault-init:
        condition: service_started
    networks: [internal]
    expose:
      - "8001"
      - "50051"

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: /api
    depends_on:
      backend:
        condition: service_started
    networks: [internal]
    expose:
      - "5173"

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_started
      backend-go:
        condition: service_started
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks: [internal]

networks:
  internal:
    driver: bridge

volumes:
  pgdata:
    name: poc-dcs-pgdata
  vaultdata:
