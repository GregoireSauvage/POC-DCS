services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cinema
      POSTGRES_USER: cinema
      POSTGRES_PASSWORD: cinema
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinema -d cinema"]
      interval: 5s
      timeout: 3s
      retries: 20

  vault:
    image: hashicorp/vault:1.16
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    command: ["vault", "server", "-dev"]
    ports:
      - "8200:8200"
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8200/v1/sys/health >/dev/null || exit 1"]
      interval: 3s
      timeout: 2s
      retries: 30

  vault-init:
    image: hashicorp/vault:1.16
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: root
      TRANSIT_KEY_NAME: cinema-dcs
      BACKEND_TOKEN_ID: backend-token
    volumes:
      - ./infra/vault/init:/init:ro
    entrypoint: ["sh", "/init/init.sh"]
    networks: [internal]
    restart: "on-failure"

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://cinema:cinema@postgres:5432/cinema
      JWT_SECRET: dev-secret-change-me
      JWT_ISSUER: cinema-dcs-poc
      JWT_AUDIENCE: cinema-ui
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: backend-token
      VAULT_TRANSIT_KEY: cinema-dcs
      VAULT_KV_PEPPER_PATH: secret/dcs   # KV v2 -> vault kv get secret/dcs
      ENV: dev
    depends_on:
      postgres:
        condition: service_healthy
      vault-init:
        condition: service_started
    networks: [internal]
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: /api
    depends_on:
      backend:
        condition: service_started
    networks: [internal]
    expose:
      - "5173"

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_started
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks: [internal]

networks:
  internal:
    driver: bridge

volumes:
  pgdata:
